spring.application.name=api-notificacao
server.port=8082

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${POSTGRES_USER:hospital}
spring.datasource.password=${POSTGRES_PASSWORD:hospital}
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:hospital}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:hospital}

spring.jpa.hibernate.ddl-auto=none

spring.flyway.schemas=notificacao
spring.flyway.default-schema=notificacao

# Configuração de Notificação
# Valores possíveis: mock (padrão) ou email
notificacao.tipo=mock

# Configuração de Email (opcional, usado quando notificacao.tipo=email)
notificacao.email.from=noreply@hospital-system.com
